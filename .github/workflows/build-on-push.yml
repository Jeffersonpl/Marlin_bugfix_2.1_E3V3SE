name: Build C13 firmware on push

on:
  push:
    branches:
      - krasnaya4-noIS
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile firmware
        run: pio run -e STM32F103RET6_creality

      - name: Publish firmware to the firmware-builds branch
        run: |
          run() { out=$("$@" 2>&1); rc=$?; echo "$out"; if [ $rc -ne 0 ]; then echo "::error::step '$*' failed ($rc): $(echo "$out" | tail -5 | tr '\n' ' ')"; exit $rc; fi; }
          BIN=$(ls .pio/build/STM32F103RET6_creality/*.bin | head -1)
          echo "::notice::built $BIN size $(stat -c %s "$BIN")"
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p /tmp/out
          cp "$BIN" "/tmp/out/k4n_${SHORT}.bin"
          (cd /tmp/out && sha256sum *.bin > SHA256SUMS.txt)
          run git config user.name "github-actions"
          run git config user.email "github-actions@users.noreply.github.com"
          run git switch --orphan fw-tmp
          cp /tmp/out/* .
          run git add -f "k4n_${SHORT}.bin" SHA256SUMS.txt
          run git commit -m "C13 firmware build from ${SHORT}"
          run git push -f origin HEAD:refs/heads/firmware-builds
